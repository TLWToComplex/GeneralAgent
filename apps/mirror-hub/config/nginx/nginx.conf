events { worker_connections 1024; }

http {
    # Docker 内嵌 DNS：用变量 proxy_pass + resolver，nginx 会每 10s 重新解析
    # 上游容器名，重建 devpi/verdaccio/backend 后无需手动重启 nginx。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Extract package names from URIs — nginx does the parsing, backend just reads JSON fields
    map $uri $mirror_package {
        "~^/pypi/root/(pypi|local)/\+simple/([^/]+)"  $2;
        "~^/npm/(?!-/)(@[^/]+/[^/]+|[^/?]+)"          $1;
        default                                        "";
    }

    map $uri $mirror_source {
        "~^/pypi/root/(pypi|local)/"  "python";
        "~^/npm/"                     "npm";
        default                       "";
    }

    # 供 proxy_pass 使用的「去前缀」路径：不改写 $uri，保证上面包名提取的 map 仍能命中
    map $uri $pypi_path {
        "~^/pypi/(.*)$"  /$1;
        default          $uri;
    }
    map $uri $npm_path {
        "~^/npm/(.*)$"  /$1;
        default         $uri;
    }

    log_format mirror_json escape=json '{'
        '"time":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"package":"$mirror_package",'
        '"source":"$mirror_source",'
        '"ua":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log mirror_json;
    access_log /dev/stdout mirror_json;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Proxy Python mirror (devpi). Strip the /pypi/ prefix before proxying.
        location /pypi/ {
            set $devpi_upstream devpi:3141;
            proxy_pass http://$devpi_upstream$pypi_path$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy npm mirror (Verdaccio). Strip the /npm/ prefix before proxying.
        location /npm/ {
            set $verdaccio_upstream verdaccio:4873;
            proxy_pass http://$verdaccio_upstream$npm_path$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy API (backend keeps the /api/ prefix).
        location /api/ {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        client_max_body_size 2G;
    }
}
